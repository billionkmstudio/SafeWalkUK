<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>SafeWalk UK · 數據覆蓋檢查</title>
<style>
:root{--bg:#0a0f1a;--ink:#e8edf5;--muted:#93a0b5;--line:rgba(232,237,245,.16);--panel:#101827;--ok:#3ee6a8;--mid:#ffb84d;--low:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Noto Sans TC',system-ui,-apple-system,'PingFang TC',sans-serif;padding:16px 16px 40px;max-width:46rem;margin-inline:auto}
h1{font-size:1.2rem;margin:4px 0}p{color:var(--muted);margin:6px 0}a{color:var(--ok)}
button{font:inherit;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--ok);background:var(--ok);color:#04140d;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.8125rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.ok{color:var(--ok);font-weight:700}.mid{color:var(--mid)}.low{color:var(--low)}
.note{font-size:.75rem}
</style></head><body>
<h1>數據覆蓋檢查</h1>
<p>量度每個地點 600 米範圍內，OpenStreetMap 同 police.uk 有幾多資料，睇邊度最適合試 3D 視線。要連去外部伺服器，請喺你部手機或電腦撳開始（約 1 分鐘）。</p>
<button id="go">開始檢查</button> <span id="st" class="note"></span>
<table><thead><tr><th>地點</th><th>街燈</th><th>lit 路段</th><th>CCTV</th><th>樓宇</th><th>罪案/月</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<p class="note">評分：街燈 + lit 路段數量愈多，燈光分析愈可信；CCTV 愈多，監控覆蓋愈有意義。OSM 資料由義工提供，覆蓋度因地而異。罪案數字僅供參考，位置為大約。</p>
<script>
(function(){
var PLACES=[['Guildford 市中心',51.2362,-0.5704],['Camberley',51.3361,-0.7436],['Reading 火車站',51.4585,-0.9715],['倫敦 City（Cheapside）',51.5138,-0.0935],['倫敦 Soho',51.5136,-0.1365],['倫敦 Shoreditch',51.5246,-0.0780],['Manchester Northern Quarter',53.4842,-2.2364],['Birmingham Bullring',52.4774,-1.8940],['Leeds 市中心',53.7965,-1.5436],['Bristol Harbourside',51.4500,-2.5970],['Cambridge 市中心',52.2053,0.1218],['Southampton 市中心',50.9025,-1.4042]];
var SRV=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
var tb=document.getElementById('rows'),st=document.getElementById('st'),btn=document.getElementById('go');
function tf(u,o,ms){var c=new AbortController(),id=setTimeout(function(){c.abort()},ms);o=o||{};o.signal=c.signal;return fetch(u,o).finally(function(){clearTimeout(id)});}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function counts(lat,lng){
  var a='(around:600,'+lat+','+lng+')';
  var q='[out:json][timeout:25];node["highway"="street_lamp"]'+a+';out count;way["highway"]["lit"~"^(yes|24/7|automatic)$"]'+a+';out count;node["man_made"="surveillance"]'+a+';out count;way["building"]'+a+';out count;';
  var i=0;
  function next(){
    if(i>=SRV.length)return Promise.reject(new Error('osm'));
    var s=SRV[i%SRV.length];i++;
    return tf(s,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}},20000)
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){var c=(j.elements||[]).filter(function(e){return e.type==='count'}).map(function(e){return +e.tags.total});if(c.length<4)throw 0;return c;})
      .catch(function(){return sleep(700).then(next)});
  }
  return next();
}
function crimes(lat,lng){
  var d=new Date();d=new Date(d.getFullYear(),d.getMonth()-2,1);var m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return tf('https://data.police.uk/api/crimes-street/all-crime?lat='+lat+'&lng='+lng+'&date='+m,null,15000).then(function(r){return r.ok?r.json():null}).then(function(j){return j?j.length:null}).catch(function(){return null});
}
function cls(v,hi,mid){return v>=hi?'ok':v>=mid?'mid':'low'}
function check(p,tr){
  tr.innerHTML='<td>'+p[0]+'</td><td colspan="6" style="text-align:left;color:var(--muted)">載入中…</td>';
  return Promise.all([counts(p[1],p[2]).catch(function(){return null}),crimes(p[1],p[2])]).then(function(res){
    var c=res[0],cr=res[1];
    if(!c){tr.innerHTML='<td>'+p[0]+'</td><td colspan="6" style="text-align:left"><span class="low">Overpass 暫時冇回應</span> <a href="#" class="rt">重試</a></td>';tr.querySelector('.rt').addEventListener('click',function(e){e.preventDefault();check(p,tr);});}
    else{
      var link='3d.html?from='+p[1]+','+p[2]+'&to='+(p[1]+0.0035).toFixed(5)+','+(p[2]+0.005).toFixed(5);
      tr.innerHTML='<td>'+p[0]+'</td><td class="'+cls(c[0],40,10)+'">'+c[0]+'</td><td class="'+cls(c[1],25,6)+'">'+c[1]+'</td><td class="'+cls(c[2],6,1)+'">'+c[2]+'</td><td>'+c[3]+'</td><td>'+(cr==null?'—':cr)+'</td><td><a href="'+link+'">3D</a></td>';
    }
  });
}
btn.addEventListener('click',function(){
  btn.disabled=true;tb.innerHTML='';
  var k=0;
  (function step(){
    if(k>=PLACES.length){st.textContent='完成。';btn.disabled=false;return;}
    var p=PLACES[k++];st.textContent='檢查中 '+k+'/'+PLACES.length+'：'+p[0]+'…';
    var tr=document.createElement('tr');tb.appendChild(tr);
    check(p,tr).then(function(){return sleep(900)}).then(step);
  })();
});
})();
</script></body></html>
