<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>SafeWalk UK · 3D 視線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed night map. Top: name + layer chips + legend. Bottom dock: pick tools, safety slider, route comparison card.
   One committed night look: ink-navy ground, mint = safest route, amber = fastest route, red = risk. */
:root {
  --bg: #0a0f1a;
  --ink: #e8edf5;
  --muted: #93a0b5;
  --line: rgba(232, 237, 245, 0.16);
  --panel: rgba(10, 15, 26, 0.84);
  --safe: #3ee6a8;
  --fast: #ff9b3d;
  --risk: #ff4d5e;
  --accent: #3ee6a8;
  --accent-ink: #04140d;
  --font-display: 'Sora', 'Noto Sans TC', system-ui, sans-serif;
  --font-body: 'Noto Sans TC', system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font-body); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; outline: none; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }

.top { position: absolute; top: 10px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; pointer-events: none; }
.name { font: 600 1.25rem/1.1 var(--font-display); letter-spacing: 0.02em; }
.sub { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; }
.layers { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; max-width: 100%; }
.layers::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: 500 0.8125rem/1 var(--font-body); min-height: 38px; padding: 0 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip:hover:not([aria-pressed="true"]) { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 0.6875rem; color: var(--muted); pointer-events: none; }
.legend i { display: block; width: 110px; height: 8px; border-radius: 4px; border: 1px solid var(--line); }

.dock { position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 34rem; }
.dock > * { pointer-events: auto; }
.viewinfo { margin: 0; padding: 7px 12px; border-radius: 12px; background: var(--panel); border: 1px solid #b07bff; font-size: 0.78rem; color: var(--ink); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.slider { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 0.8125rem; }
.slider label { flex: none; color: var(--muted); }
.slider input { flex: 1; min-width: 0; accent-color: var(--safe); }
.slider output { flex: none; width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--safe); }

.card { padding: 10px 12px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; }
.card-head button { font: 500 0.75rem/1 var(--font-body); min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.grid { display: grid; grid-template-columns: 5.2em 1fr 1fr; gap: 5px 10px; margin-top: 8px; font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
.grid .h { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.grid .h i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.grid .l { color: var(--muted); }
.grid .good { color: var(--safe); font-weight: 700; }
.verdict { margin: 8px 0 0; font-size: 0.8125rem; }
.note { margin: 6px 0 0; font-size: 0.6875rem; color: var(--muted); }
.card.collapsed .grid, .card.collapsed .verdict { display: none; }

.loading, .fail { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; padding: 12px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-align: center; width: max-content; max-width: 90%; }
.back { font-size: 0.75rem; color: var(--accent); text-decoration: none; margin-left: auto; pointer-events: auto; }
</style>

</head><body>
<main id="app">
  <div id="stage" tabindex="0" aria-label="夜間街區 3D 地圖"></div>

  <header class="top">
    <div class="brand"><span class="name">SafeWalk UK</span><span class="sub">夜歸安全透視 · 3D 視線（實驗）</span><a class="back" href="./">← 返回路線</a></div>
    <nav class="layers" id="layers" aria-label="地圖圖層">
      <button class="chip" type="button" data-layer="risk" aria-pressed="true">綜合風險</button>
      <button class="chip" type="button" data-layer="light" aria-pressed="false">燈光</button>
      <button class="chip" type="button" data-layer="cctv" aria-pressed="false">CCTV</button>
      <button class="chip" type="button" data-layer="sight" aria-pressed="false">視線死角</button>
      <button class="chip" type="button" data-layer="crime" aria-pressed="false">罪案</button>
      <button class="chip" type="button" data-layer="none" aria-pressed="false">純 3D</button>
    </nav>
    <div class="legend" id="legend"><span id="lg-lo"></span><i id="lg-bar"></i><span id="lg-hi"></span></div>
  </header>

  <section class="dock">
    <p class="viewinfo" id="viewinfo" hidden></p>
    <div class="tools" role="group" aria-label="點選地面">
      <button class="chip" type="button" id="t-start" aria-pressed="false">設起點</button>
      <button class="chip" type="button" id="t-end" aria-pressed="false">設終點</button>
      <button class="chip" type="button" id="t-view" aria-pressed="false">睇視線</button>
    </div>
    <div class="slider">
      <label for="k">安全優先</label>
      <input id="k" type="range" min="0" max="10" step="1" value="6">
      <output id="k-out" for="k">6</output>
    </div>
    <section class="card" id="card">
      <div class="card-head"><span>路線比較</span><button type="button" id="card-toggle" aria-expanded="true">收起</button></div>
      <div class="grid" id="grid"></div>
      <p class="verdict" id="verdict"></p>
      <p class="note" id="datanote"></p>
    </section>
  </section>

  <p id="loading" class="loading">載入數據中…</p>
  <p id="fail" class="fail" hidden></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var CELL = 2, DW = 240, DD = 190, GW = 120, GD = 95, NCELL = GW * GD, DATA = null;
  var stage = document.getElementById('stage');
  var loadEl = document.getElementById('loading');
  var failEl = document.getElementById('fail');
  function fail(msg) { loadEl.hidden = true; failEl.textContent = msg; failEl.hidden = false; }
  if (typeof THREE === 'undefined') { fail('3D 引擎載入失敗，請檢查網絡後重新整理。'); return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { fail('呢部裝置暫時未能顯示 3D 場景（WebGL 未啟用）。'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);
  /* =====================================================================
     1. DATA  (real: OpenStreetMap via Overpass + data.police.uk)
        Local metres: x = east, z = south, origin = north-west corner of the
        route's bounding box (+ padding). Everything below only reads DATA.
        buildings: {pts:[[x,z]...], h}   roads: {pts, rad, walk}
        areas: {pts, kind, walk}         lamps: {x,z,p,r,kind,broken,virt}
        cams: {x,z,dir,fov,range}        incidents: [x, z, weight]
     ===================================================================== */
  var params = new URLSearchParams(location.search);
  function parseLL(s, d) { if (s) { var p = s.split(','), a = parseFloat(p[0]), b = parseFloat(p[1]); if (isFinite(a) && isFinite(b)) return [a, b]; } return d; }
  var A = parseLL(params.get('from'), [51.2370, -0.5743]), B = parseLL(params.get('to'), [51.2430, -0.5700]);
  var PAD = 140, latMid = (A[0] + B[0]) / 2, mLat = 110574, mLng = 111320 * Math.cos(latMid * Math.PI / 180);
  if (Math.max(Math.abs(B[1] - A[1]) * mLng, Math.abs(B[0] - A[0]) * mLat) > 1200) { fail('起點同終點相距超過 1.2 公里。3D 視線模組暫時只支援短程路線（例如夜歸最後一段）。'); return; }
  var south = Math.min(A[0], B[0]) - PAD / mLat, north = Math.max(A[0], B[0]) + PAD / mLat;
  var west = Math.min(A[1], B[1]) - PAD / mLng, east = Math.max(A[1], B[1]) + PAD / mLng;
  DW = Math.round((east - west) * mLng); DD = Math.round((north - south) * mLat);
  CELL = Math.max(2, Math.ceil(Math.max(DW, DD) / 330)); GW = Math.ceil(DW / CELL); GD = Math.ceil(DD / CELL); NCELL = GW * GD;
  function toX(lng) { return (lng - west) * mLng; }
  function toZ(lat) { return (north - lat) * mLat; }

  var OVERPASS = ['api/overpass', 'https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
  function timeoutFetch(url, opts, ms) {
    var c = new AbortController(), id = setTimeout(function () { c.abort(); }, ms);
    opts = opts || {}; opts.signal = c.signal;
    return fetch(url, opts).finally(function () { clearTimeout(id); });
  }
  var osmErrs = [];
  function fetchPart(q, key) {
    var tries = 0, maxTries = OVERPASS.length + 2;
    try { var cached = sessionStorage.getItem(key); if (cached) return Promise.resolve(JSON.parse(cached)); } catch (e) {}
    function next() {
      if (tries >= maxTries) return Promise.reject(new Error('osm'));
      var srv = OVERPASS[tries % OVERPASS.length], cur = srv === 'api/overpass' ? 'proxy' : srv.split('/')[2], wait = tries > 1 ? 1200 : 0;
      tries++;
      return new Promise(function (r) { setTimeout(r, wait); }).then(function () {
        if (srv === 'api/overpass') return timeoutFetch(srv + '?data=' + encodeURIComponent(q), null, 40000);
        return timeoutFetch(srv, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }, 30000);
      }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (j) { if (!j || !j.elements) throw new Error('empty'); try { sessionStorage.setItem(key, JSON.stringify(j)); } catch (e) {} return j; })
        .catch(function (e) { osmErrs.push(cur + ': ' + (e && e.name === 'AbortError' ? 'timeout' : (e && e.message) || 'blocked')); return next(); });
    }
    return next();
  }
  function fetchOSM() {
    var bb = south.toFixed(5) + ',' + west.toFixed(5) + ',' + north.toFixed(5) + ',' + east.toFixed(5), H = '[out:json][timeout:25];';
    // three smaller queries run in parallel: each is faster, cacheable on its own, and fits the server time limit
    var qB = H + 'way["building"](' + bb + ');out geom;';
    var qR = H + '(way["highway"](' + bb + ');way["leisure"~"park|garden|pitch|nature_reserve|recreation_ground"](' + bb + ');way["landuse"~"grass|recreation_ground|forest|meadow|village_green"](' + bb + ');way["natural"~"wood|water"](' + bb + ');way["amenity"="parking"](' + bb + '););out geom;';
    var qN = H + '(node["highway"="street_lamp"](' + bb + ');node["man_made"="surveillance"](' + bb + ');node["amenity"~"pub|bar|fuel|restaurant|fast_food|pharmacy"](' + bb + ');node["shop"~"convenience|supermarket"](' + bb + '););out;';
    return Promise.all([fetchPart(qB, 'sw3d_b_' + bb), fetchPart(qR, 'sw3d_r_' + bb), fetchPart(qN, 'sw3d_n_' + bb)]).then(function (p) {
      return { elements: p[0].elements.concat(p[1].elements, p[2].elements) };
    });
  }
  function fetchCrimes() {
    var now = new Date(), months = [2, 3, 4].map(function (k) { var d = new Date(now.getFullYear(), now.getMonth() - k, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); });
    var pts = [A, B, [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2]], reqs = [];
    pts.forEach(function (p) { months.forEach(function (m) {
      reqs.push(timeoutFetch('https://data.police.uk/api/crimes-street/all-crime?lat=' + p[0] + '&lng=' + p[1] + '&date=' + m, null, 12000).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return null; }));
    }); });
    return Promise.all(reqs).then(function (all) {
      var seen = {}, out = [], okCount = 0;
      all.forEach(function (list) { if (!list) return; okCount++; list.forEach(function (c) { if (!seen[c.id]) { seen[c.id] = 1; out.push(c); } }); });
      return { list: out, ok: okCount > 0 };
    });
  }
  var CRIME_W = { 'violent-crime': 3, 'robbery': 3, 'possession-of-weapons': 3, 'burglary': 2, 'theft-from-the-person': 2, 'public-order': 1.5, 'vehicle-crime': 1.2, 'criminal-damage-arson': 1.2, 'drugs': 1, 'anti-social-behaviour': 1, 'other-theft': 0.8, 'other-crime': 0.8, 'shoplifting': 0.4, 'bicycle-theft': 0.4 };
  var ROAD_W = { motorway: 12, trunk: 10, primary: 9, secondary: 8, tertiary: 7, unclassified: 6, residential: 6, living_street: 5, service: 3.5, pedestrian: 5, footway: 2.2, path: 2.2, cycleway: 2.4, steps: 2, track: 3, bridleway: 2.2, corridor: 2 };
  var NOWALK = { motorway: 1, motorway_link: 1, construction: 1, proposed: 1, raceway: 1 };
  var RESI = { house: 1, detached: 1, semidetached_house: 1, terrace: 1, bungalow: 1, residential: 1, garage: 1, garages: 1, shed: 1, roof: 1 };

  function buildData(osm, crimes) {
    var D = { buildings: [], roads: [], areas: [], lamps: [], cams: [], incidents: [], stats: {} };
    var mapped = 0, litWays = 0, litLen = 0;
    function ring(g) { var p = g.map(function (q) { return [toX(q.lon), toZ(q.lat)]; }); if (p.length > 1 && p[0][0] === p[p.length - 1][0] && p[0][1] === p[p.length - 1][1]) p.pop(); return p; }
    osm.elements.forEach(function (el) {
      var t = el.tags || {};
      if (el.type === 'way' && el.geometry && el.geometry.length > 1) {
        if (t.building) {
          var p = ring(el.geometry); if (p.length < 3) return;
          var h = parseFloat(t.height); if (!isFinite(h)) { var lv = parseFloat(t['building:levels']); h = isFinite(lv) ? lv * 3.1 + 1 : (RESI[t.building] ? 7 : 9); }
          D.buildings.push({ pts: p, h: Math.max(3, Math.min(120, h)) });
        } else if (t.highway) {
          if (NOWALK[t.highway] || t.foot === 'no' || t.access === 'private' || t.access === 'no') { D.roads.push({ pts: el.geometry.map(function (q) { return [toX(q.lon), toZ(q.lat)]; }), rad: (ROAD_W[t.highway] || 5) / 2, walk: false }); return; }
          if (t.highway === 'corridor' || t.indoor === 'yes') return;
          if ((t.area === 'yes' || t.highway === 'pedestrian') && el.geometry.length >= 4 && el.geometry[0].lat === el.geometry[el.geometry.length - 1].lat && el.geometry[0].lon === el.geometry[el.geometry.length - 1].lon) { D.areas.push({ pts: ring(el.geometry), kind: 'park', walk: true }); if (t.area === 'yes') return; }
          var w = ROAD_W[t.highway] || 5, pts = el.geometry.map(function (q) { return [toX(q.lon), toZ(q.lat)]; });
          D.roads.push({ pts: pts, w: w, rad: w / 2 + 2.5, walk: true, hw: t.highway });
          if (t.lit === 'yes' || t.lit === '24/7' || t.lit === 'automatic') {
            litWays++;
            var acc = 12;
            for (var i = 1; i < pts.length; i++) {
              var sl = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]), pos = 0;
              while (acc <= sl - pos + 0.001) { pos += acc; var f = pos / (sl || 1); D.lamps.push({ x: pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, z: pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f, p: 0.4, r: 22, kind: 'lamp', virt: true }); acc = 28; }
              acc -= (sl - pos); litLen += sl;
            }
          }
        } else if (el.geometry.length >= 4) {
          var kind = null, walk = false;
          if (t.leisure === 'park' || t.leisure === 'recreation_ground' || t.leisure === 'nature_reserve' || t.landuse === 'recreation_ground' || t.landuse === 'village_green') { kind = 'green'; walk = true; }
          else if (t.leisure === 'garden' || t.leisure === 'pitch' || t.landuse === 'grass' || t.landuse === 'meadow' || t.landuse === 'forest' || t.natural === 'wood') kind = 'green';
          else if (t.natural === 'water') kind = 'water';
          else if (t.amenity === 'parking') { kind = 'park'; walk = true; }
          if (kind) D.areas.push({ pts: ring(el.geometry), kind: kind, walk: walk });
        }
      } else if (el.type === 'node' && isFinite(el.lat)) {
        var x = toX(el.lon), z = toZ(el.lat);
        if (t.highway === 'street_lamp') { mapped++; D.lamps.push({ x: x, z: z, p: t.disused || t.broken ? 0 : 0.45, r: 22, kind: 'lamp', broken: !!(t.disused || t.broken) }); }
        else if (t.man_made === 'surveillance') {
          if (t.surveillance === 'indoor') return;
          var dirv = parseFloat(t['camera:direction'] || t.direction), dome = t['camera:type'] === 'dome' || t['camera:type'] === 'panning';
          if (isFinite(dirv) && !dome) D.cams.push({ x: x, z: z, dir: dirv - 90, fov: 90, range: 40 });
          else D.cams.push({ x: x, z: z, dir: 0, fov: 360, range: 25 });
        } else if (t.amenity || t.shop) D.lamps.push({ x: x, z: z, p: 0.6, r: 12, kind: 'shop' });

    });
    var nc = 0;
    crimes.list.forEach(function (c) {
      var x = toX(+c.location.longitude), z = toZ(+c.location.latitude);
      if (x < -20 || z < -20 || x > DW + 20 || z > DD + 20) return;
      D.incidents.push([x, z, CRIME_W[c.category] || 1]); nc++;
    });

    return D;
  }

  loadEl.textContent = '載入 OpenStreetMap 樓宇、街燈、CCTV 同 police.uk 罪案數據…';
  Promise.all([fetchOSM(), fetchCrimes()]).then(function (res) {
    DATA = buildData(res[0], res[1]);
    loadEl.textContent = '計算燈光、CCTV 同視線…';
    setTimeout(boot, 30);
  }).catch(function () {
    fail('未能載入地圖數據（build c4）。' + (osmErrs.length ? '原因：' + osmErrs.slice(-6).join(' | ') : '') + ' 請等一兩分鐘後重新整理。');
  });

  function boot() {
  /* =====================================================================
     2. ANALYSIS  (3D-aware: lamps and cameras sit above ground, so building
        height decides what is lit or seen; sightlines use eye height)
     ===================================================================== */
  var NB = DATA.buildings.length;
  var Bx0 = new Float32Array(NB), Bz0 = new Float32Array(NB), Bx1 = new Float32Array(NB), Bz1 = new Float32Array(NB), Bh = new Float32Array(NB);
  DATA.buildings.forEach(function (b, i) {
    var x0 = 1e9, z0 = 1e9, x1 = -1e9, z1 = -1e9;
    b.pts.forEach(function (p) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < z0) z0 = p[1]; if (p[1] > z1) z1 = p[1]; });
    Bx0[i] = x0; Bz0[i] = z0; Bx1[i] = x1; Bz1[i] = z1; Bh[i] = b.h;
  });
  function pip(x, z, pts) {
    var inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i][0], zi = pts[i][1], xj = pts[j][0], zj = pts[j][1];
      if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi)) inside = !inside;
    }
    return inside;
  }
  // spatial index: 25 m buckets
  var BK = 25, BNX = Math.ceil(DW / BK) + 1, BNZ = Math.ceil(DD / BK) + 1, bucket = new Array(BNX * BNZ), stamp = new Int32Array(NB), stampN = 0;
  function bclamp(v, n) { return Math.max(0, Math.min(n - 1, v)); }

    }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);

  setTimeout(function () {
    var t0 = performance.now();
    computeFields();
    setLayer('risk'); drawPins(); recompute();
    window.__swReady = true; window.__swMs = Math.round(performance.now() - t0);
    var st = DATA.stats, warn = (st.lampsMapped + st.litM / 28) < Math.max(8, DW * DD / 6000) ? ' ⚠ 呢區 OSM 街燈資料偏少，燈光分析可能偏保守。' : '';
    document.getElementById('datanote').textContent = 'OpenStreetMap：樓宇 ' + st.bld + ' · 街燈 ' + st.lampsMapped + '（另有 ' + Math.round(st.litM) + ' m 標記 lit 路段）· CCTV ' + st.cams + '。罪案：' + (st.crimesOk ? 'police.uk 近 3 個月 ' + st.crimes + ' 宗（位置為大約）' : '暫時載入唔到') + '。實驗性指標，唔代表人身安全保證。' + warn;
    loadEl.hidden = true;
  }, 30);
  }
})();
</script>
